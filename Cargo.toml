[package]
name = "sh148-exif-file-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
filetime = "0.2"
slint = { version = "1.9", optional = true }

[build-dependencies]
slint-build = "1"

[features]
default = ["gui-slint"]
gui-slint = ["dep:slint"]

[package.metadata.slint]
include-path = ["src/gui_slint"]
