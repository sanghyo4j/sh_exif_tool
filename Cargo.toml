[package]
name = "sh148-photo-management-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
filetime = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
slint = { version = "1.9", optional = true }

[build-dependencies]
slint-build = "1"

[features]
default = ["gui-slint"]
gui-slint = ["dep:slint"]

[package.metadata.slint]
include-path = ["src/gui_slint"]

# Keep application code debuggable while making high-resolution preview decoding practical.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
